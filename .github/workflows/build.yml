name: Build Windows screensaver

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set build version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -match '^v?(\d+\.\d+\.\d+)$') {
            $version = $Matches[1]
          } else {
            $version = "0.1.$env:GITHUB_RUN_NUMBER"
          }
          "BUILD_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Ensure no logo artwork is compiled into the app
        shell: pwsh
        run: |
          $images = Get-ChildItem -Path src -Recurse -File | Where-Object { $_.Extension -match '^\.(png|jpg|jpeg|gif|bmp|svg|webp)$' }
          if ($images) {
            $images | ForEach-Object { Write-Error "Image asset found in source tree: $($_.FullName)" }
            throw "Production builds must not contain logo/image assets. Logos are runtime configuration only."
          }

      - name: Test physics and topology
        run: dotnet test --project tests/BouncingScreensaver.Core.Tests/BouncingScreensaver.Core.Tests.csproj -c Release

      - name: Publish self-contained Windows executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/publish, artifacts/release | Out-Null
          dotnet publish src/BouncingScreensaver.Windows/BouncingScreensaver.Windows.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Version=$env:BUILD_VERSION `
            -o artifacts/publish

          $exe = Join-Path $PWD 'artifacts/publish/BouncingScreensaver.exe'
          if (-not (Test-Path $exe)) { throw "Published executable not found." }

          & $exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "Screensaver self-test failed." }

          Copy-Item $exe artifacts/release/BouncingScreensaver.scr

      - name: Install NSIS build tool
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Build silent-capable installer
        shell: pwsh
        run: |
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { throw "makensis.exe was not found." }
          $scrPath = (Resolve-Path 'artifacts/release/BouncingScreensaver.scr').Path
          $outputDir = (Resolve-Path 'artifacts/release').Path
          & $makensis "/V2" "/DVERSION=$env:BUILD_VERSION" "/DSCR_PATH=$scrPath" "/DOUTPUT_DIR=$outputDir" installer/BouncingScreensaver.nsi
          if ($LASTEXITCODE -ne 0) { throw "NSIS build failed." }

      - name: Smoke-test silent install and uninstall
        shell: pwsh
        run: |
          $setup = (Resolve-Path 'artifacts/release/BouncingScreensaver-Setup.exe').Path
          $install = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Silent installer returned $($install.ExitCode)." }

          $installedScr = "$env:ProgramFiles\BouncingScreensaver\BouncingScreensaver.scr"
          if (-not (Test-Path $installedScr)) { throw "Installed .scr was not found." }
          if (Test-Path "$env:ProgramFiles\BouncingScreensaver\logo.png") { throw "Logo must not be installed with the binary." }

          $test = Start-Process -FilePath $installedScr -ArgumentList '--self-test' -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw "Installed screensaver self-test failed." }

          $uninstaller = "$env:ProgramFiles\BouncingScreensaver\Uninstall.exe"
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Silent uninstaller returned $($uninstall.ExitCode)." }

      - name: Add deployment helper and documentation to release bundle
        shell: pwsh
        run: |
          Copy-Item scripts/Set-BouncingScreensaverSetting.ps1 artifacts/release/
          Copy-Item DEPLOYMENT.md artifacts/release/
          Compress-Archive -Path artifacts/release/* -DestinationPath "artifacts/BouncingScreensaver-$env:BUILD_VERSION.zip" -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: BouncingScreensaver-${{ env.BUILD_VERSION }}
          path: |
            artifacts/release/*
            artifacts/BouncingScreensaver-*.zip
          if-no-files-found: error

      - name: Publish GitHub release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(
            'artifacts/release/BouncingScreensaver.scr',
            'artifacts/release/BouncingScreensaver-Setup.exe',
            "artifacts/BouncingScreensaver-$env:BUILD_VERSION.zip"
          )

          gh release view "$env:GITHUB_REF_NAME" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:GITHUB_REF_NAME" @files --clobber
          } else {
            gh release create "$env:GITHUB_REF_NAME" @files --generate-notes
          }
